<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School settings — LAPMS</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script>try{var t=localStorage.getItem('lapms.theme')||'light';if(t!=='system')document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
</head>
<body>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {
  var m = Shell.mount({
    roles: ['admin'],
    page: 'admin-settings',
    title: 'School settings',
    sub: 'Profile, school day, notifications'
  });
  if (!m) return;

  var el = U.el, c = m.content, s = Store.session(), d = Store.db();

  c.appendChild(el('p', { class: 'page-intro' },
    'Every change here is written to the audit log.'));

  var grid = el('div', { class: 'grid grid-2' });
  c.appendChild(grid);

  // ---------------- School profile ----------------
  var sf = {};
  function schoolField(key, label, type) {
    sf[key] = el('input', { type: type || 'text', id: 'sc_' + key, value: d.school[key] || '' });
    return el('div', { class: 'field' }, [el('label', { for: 'sc_' + key }, label), sf[key]]);
  }
  var schoolForm = el('div', null, [
    schoolField('name', 'School name'),
    schoolField('motto', 'Motto'),
    el('div', { class: 'field-row' }, [schoolField('county', 'County'), schoolField('phone', 'Telephone')]),
    schoolField('address', 'Postal address'),
    schoolField('email', 'Office email', 'email'),
    el('button', {
      class: 'btn btn-primary btn-sm', type: 'button',
      onclick: function () {
        var patch = {};
        Object.keys(sf).forEach(function (k) { patch[k] = sf[k].value.trim(); });
        Store.updateSchool(s, patch);
        U.toast('School profile saved');
      }
    }, 'Save profile')
  ]);
  grid.appendChild(Shell.card('School profile', '', schoolForm));

  // ---------------- The school day ----------------
  var tf = {};
  function timeField(key, label, hint) {
    tf[key] = el('input', { type: 'time', id: 'tm_' + key, value: d.settings[key] });
    return el('div', { class: 'field' }, [
      el('label', { for: 'tm_' + key }, label), tf[key],
      hint ? el('p', { class: 'hint', text: hint }) : null
    ]);
  }
  var termInput = el('input', { type: 'text', id: 'term', value: d.settings.term });
  var dayForm = el('div', null, [
    el('div', { class: 'field' }, [el('label', { for: 'term' }, 'Academic term'), termInput]),
    el('div', { class: 'field-row' }, [
      timeField('schoolStart', 'School starts'),
      timeField('schoolEnd', 'School ends')
    ]),
    timeField('lateAfter', 'A learner is late after', 'Arrivals after this default to Late.'),
    timeField('attendanceCutoff', 'Register cut-off',
      'After this, the teacher and the office are notified.'),
    el('button', {
      class: 'btn btn-primary btn-sm', type: 'button',
      onclick: function () {
        var patch = { term: termInput.value.trim() };
        Object.keys(tf).forEach(function (k) { patch[k] = tf[k].value; });
        Store.updateSettings(s, patch);
        U.toast('School day saved');
      }
    }, 'Save the school day')
  ]);
  grid.appendChild(Shell.card('The school day', '', dayForm));

  // ---------------- Notification rules ----------------
  var toggles = [
    ['notifyParentOnAbsent', 'Notify the guardian when a learner is marked absent'],
    ['notifyParentOnLate', 'Notify the guardian when a learner is marked late'],
    ['notifyOnMissingRegister', 'Notify staff when a register is not taken by the cut-off'],
    ['releaseConfirmation', 'Record release from school at the end of the day']
  ];
  var nf = {};
  var notifForm = el('div');
  toggles.forEach(function (t) {
    nf[t[0]] = el('input', { type: 'checkbox', id: 'nf_' + t[0], style: 'width:auto', checked: d.settings[t[0]] ? true : null });
    notifForm.appendChild(el('div', { class: 'row', style: 'gap:10px;padding:9px 0;border-bottom:1px solid var(--border)' }, [
      nf[t[0]],
      el('label', { for: 'nf_' + t[0], style: 'margin:0;font-weight:500;color:var(--text-primary)' }, t[1])
    ]));
  });
  notifForm.appendChild(el('button', {
    class: 'btn btn-primary btn-sm', style: 'margin-top:14px', type: 'button',
    onclick: function () {
      var patch = {};
      Object.keys(nf).forEach(function (k) { patch[k] = nf[k].checked; });
      Store.updateSettings(s, patch);
      U.toast('Notification rules saved');
    }
  }, 'Save notification rules'));
  grid.appendChild(Shell.card('Notification rules',
    'Only ever to the linked guardian.', notifForm));

  // ---------------- Data protection ----------------
  var dpBody = el('div', { style: 'font-size:.875rem' }, [
    el('p', { class: 'secondary' },
      'Aligned to the Data Protection Act, 2019. The school remains the data controller.'),
    el('ul', { class: 'check-list', style: 'list-style:none;padding:0' }, [
      ['Data minimisation', 'Only the fields needed for attendance, safety and contact are collected. Learner photographs are optional.'],
      ['Purpose limitation', 'Records are used for attendance, safeguarding and school reporting — nothing else.'],
      ['Access control', 'Role-based, enforced in the data layer. Guardians reach only their own children.'],
      ['Audit trail', 'Creation, editing and deletion of records are logged and retained.'],
      ['Retention', 'Attendance and behaviour records are kept for the period the school’s policy requires, then deleted.'],
      ['Rights', 'Guardians may request access to, and correction of, their own child’s records through the school office.']
    ].map(function (r) {
      return el('li', { style: 'display:block;padding:9px 0;border-bottom:1px solid var(--border)' }, [
        el('div', { style: 'font-weight:600;font-size:.85rem', text: r[0] }),
        el('div', { class: 'muted', style: 'font-size:.8rem', text: r[1] })
      ]);
    })),
    el('a', { class: 'btn btn-sm', href: '../privacy.html', style: 'margin-top:14px' }, 'Read the privacy notice')
  ]);
  grid.appendChild(Shell.card('Data protection', null, dpBody));

  // ---------------- Demonstration data ----------------
  var resetBody = el('div', null, [
    el('p', { class: 'secondary', style: 'font-size:.875rem' },
      'Rebuilds the fictional school and discards every change made while exploring.'),
    el('button', {
      class: 'btn btn-danger btn-sm', type: 'button',
      onclick: function () {
        U.confirmBox('Reset demonstration data',
          'The school is rebuilt and you are signed out.',
          function () { Store.reset(); Store.clearSession(); location.href = '../login.html'; }, 'Reset');
      }
    }, 'Reset demonstration data')
  ]);
  grid.appendChild(Shell.card('Demonstration data', null, resetBody));
})();
</script>
</body>
</html>
