<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages — LAPMS</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script>try{var t=localStorage.getItem('lapms.theme')||'light';if(t!=='system')document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
</head>
<body>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {
  var role = Store.scope(Store.session()).role;
  var m = Shell.mount({
    roles: ['teacher', 'parent', 'admin'],
    page: 'messages',
    title: role === 'parent' ? 'Messages' : 'Parent messages',
    sub: role === 'parent'
      ? 'Conversations about your children with their teachers'
      : 'Conversations with guardians of your authorised learners'
  });
  if (!m) return;

  var el = U.el, c = m.content, s = Store.session(), sc = m.scope;
  var focus = U.qs('learner');
  var state = { learnerId: focus && Store.learner(s, focus) ? focus : '' };

  var learners = Store.learners(s, {});
  var learnerSel = el('select', { id: 'ml' }, [el('option', { value: '' }, 'All conversations')].concat(
    learners.map(function (l) {
      return el('option', { value: l.id, selected: l.id === state.learnerId ? true : null },
        l.name + ' — ' + Store.classLabel(l.classId));
    })));
  learnerSel.addEventListener('change', function () { state.learnerId = learnerSel.value; render(); });

  var newBtn = el('button', { class: 'btn btn-sm btn-primary', type: 'button' }, 'Start a conversation');
  newBtn.addEventListener('click', function () { startNew(); });

  c.appendChild(el('div', { class: 'filters' }, [
    el('div', { class: 'field', style: 'flex:1 1 280px' }, [
      el('label', { for: 'ml' }, role === 'parent' ? 'Child' : 'Learner'), learnerSel
    ]),
    el('div', { class: 'grow' }),
    newBtn
  ]));

  var host = el('div', { class: 'grid' });
  c.appendChild(host);

  function startNew() {
    var sel = el('select', { id: 'nl' }, learners.map(function (l) {
      return el('option', { value: l.id, selected: l.id === state.learnerId ? true : null },
        l.name + ' — ' + Store.classLabel(l.classId));
    }));
    var box = el('textarea', { id: 'nt', placeholder: 'Write your message…' });
    U.modal('Start a conversation', el('div', null, [
      el('div', { class: 'field' }, [el('label', { for: 'nl' }, role === 'parent' ? 'About' : 'Learner'), sel]),
      el('div', { class: 'field' }, [el('label', { for: 'nt' }, 'Message'), box]),
      el('p', { class: 'hint', style: 'margin:0' },
        role === 'parent'
          ? 'Your message goes to the class teacher for this learner.'
          : 'Your message goes to the authorised guardians of this learner.')
    ]), {
      actions: function (close) {
        return [
          el('button', { class: 'btn', onclick: close }, 'Cancel'),
          el('button', {
            class: 'btn btn-primary',
            onclick: function () {
              if (!box.value.trim()) { U.toast('Please write a message'); return; }
              try {
                Store.addComment(s, sel.value, box.value.trim(), null);
                U.toast('Message sent'); close(); render();
              } catch (err) { U.toast('Not permitted: ' + err.message); }
            }
          }, 'Send')
        ];
      }
    });
  }

  function renderThread(t) {
    var learner = Store.learner(s, t.root.learnerId);
    if (!learner) return null;

    var all = [t.root].concat(t.replies);
    var last = all[all.length - 1];
    var lastAuthor = Store.userById(last.authorId);
    // The other side spoke last, so the ball is in this reader's court.
    var awaitingMe = !!lastAuthor && lastAuthor.id !== sc.userId && lastAuthor.role !== sc.role;

    var thread = el('div', { class: 'thread' });
    all.forEach(function (cm) {
      var author = Store.userById(cm.authorId);
      thread.appendChild(el('div', { class: 'comment' + (cm.authorId === sc.userId ? ' mine' : '') }, [
        el('span', { class: 'avatar', 'aria-hidden': 'true', text: U.initials(author ? author.name : '?') }),
        el('div', { class: 'comment-body' }, [
          el('div', { class: 'comment-head' }, [
            el('span', { class: 'comment-author', text: author ? author.name : 'Unknown' }),
            el('span', { class: 'badge badge-neutral', style: 'font-size:.64rem',
              text: author ? Shell.ROLE_LABEL[author.role] : '' }),
            el('span', { class: 'comment-time', text: U.relativeDay(cm.date) + ' ' + cm.time })
          ]),
          el('div', { class: 'comment-text', text: cm.text })
        ])
      ]));
    });

    var box = el('textarea', { placeholder: 'Write a reply…', 'aria-label': 'Reply about ' + learner.name });
    var send = el('button', { class: 'btn btn-primary btn-sm', type: 'button' }, 'Send reply');
    send.addEventListener('click', function () {
      if (!box.value.trim()) return;
      try {
        Store.addComment(s, learner.id, box.value.trim(), t.root.id);
        U.toast('Reply sent'); render();
      } catch (err) { U.toast('Not permitted: ' + err.message); }
    });

    var head = el('div', { class: 'row-between', style: 'margin-bottom:14px' }, [
      el('div', { class: 'row', style: 'gap:10px' }, [
        el('span', { class: 'avatar', 'aria-hidden': 'true', text: U.initials(learner.name) }),
        el('span', null, [
          el('a', { href: 'learner.html?id=' + learner.id, style: 'color:inherit;font-weight:650;font-size:.95rem', text: learner.name }),
          el('div', { class: 'muted', style: 'font-size:.74rem', text: Store.classLabel(learner.classId) })
        ])
      ]),
      awaitingMe ? el('span', { class: 'badge badge-late' }, [el('span', { class: 'dot' }), 'Awaiting your reply']) : null
    ]);

    return el('section', { class: 'card' }, [
      head, thread,
      el('div', { style: 'margin-top:14px' }, [
        box, el('div', { class: 'row', style: 'justify-content:flex-end;margin-top:8px' }, [send])
      ])
    ]);
  }

  function render() {
    U.clear(host);
    var threads = Store.threads(s, state.learnerId ? { learnerId: state.learnerId } : {});

    if (!threads.length) {
      host.appendChild(Shell.emptyState(
        state.learnerId
          ? 'No conversation about this learner yet. Start one above.'
          : 'No conversations yet. Start one above.'));
      return;
    }

    host.appendChild(el('p', { class: 'page-intro', style: 'margin:0' },
      U.plural(threads.length, 'conversation') + '. Only the learner’s teachers and authorised guardians can see these.'));

    threads.forEach(function (t) {
      var node = renderThread(t);
      if (node) host.appendChild(node);
    });
  }

  render();
})();
</script>
</body>
</html>
