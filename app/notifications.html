<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications — LAPMS</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script>try{var t=localStorage.getItem('lapms.theme')||'light';if(t!=='system')document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
</head>
<body>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {
  var m = Shell.mount({
    roles: ['admin', 'teacher', 'parent'],
    page: 'notifications',
    title: 'Notifications',
    sub: ''
  });
  if (!m) return;

  var el = U.el, c = m.content, s = Store.session();

  var TYPES = {
    absent:       { icon: '✕', label: 'Absence' },
    late:         { icon: '◴', label: 'Lateness' },
    behaviour:    { icon: '★', label: 'Behaviour' },
    register:     { icon: '⚠', label: 'Register' },
    announcement: { icon: '📣', label: 'Announcement' },
    comment:      { icon: '✉', label: 'Comments' },
    reply:        { icon: '✉', label: 'Comments' }
  };

  var state = { type: '', unreadOnly: false };

  var typeSel = el('select', { id: 'typeSel' }, [el('option', { value: '' }, 'All types')].concat(
    Object.keys(TYPES).filter(function (k, i, arr) {
      return arr.indexOf(k) === i && k !== 'reply';
    }).map(function (k) { return el('option', { value: k }, TYPES[k].label); })
  ));
  var unreadBox = el('input', { type: 'checkbox', id: 'unreadOnly', style: 'width:auto' });
  typeSel.addEventListener('change', function () { state.type = typeSel.value; render(); });
  unreadBox.addEventListener('change', function () { state.unreadOnly = unreadBox.checked; render(); });

  var markAll = el('button', { class: 'btn btn-sm', type: 'button' }, 'Mark all as read');
  markAll.addEventListener('click', function () {
    Store.markAllRead(s);
    U.toast('All notifications marked as read');
    render();
  });

  c.appendChild(el('div', { class: 'filters' }, [
    el('div', { class: 'field' }, [el('label', { for: 'typeSel' }, 'Type'), typeSel]),
    el('div', { class: 'row', style: 'align-self:center;gap:7px' }, [
      unreadBox, el('label', { for: 'unreadOnly', style: 'margin:0' }, 'Unread only')
    ]),
    el('div', { class: 'grow' }),
    markAll
  ]));

  var host = el('div');
  c.appendChild(host);

  function render() {
    U.clear(host);
    var list = Store.notifications(s, state.unreadOnly).filter(function (n) {
      if (!state.type) return true;
      if (state.type === 'comment') return n.type === 'comment' || n.type === 'reply';
      return n.type === state.type;
    });

    var unread = Store.unreadCount(s);
    var body = el('div', { class: 'card card-pad-0' });
    if (!list.length) {
      body.appendChild(el('div', { style: 'padding:20px' }, Shell.emptyState('No notifications match this filter.')));
    }

    list.forEach(function (n) {
      var meta = TYPES[n.type] || { icon: '•', label: n.type };
      var row = el('div', { class: 'notif' + (n.read ? '' : ' unread') }, [
        el('span', { class: 'notif-icon', 'aria-hidden': 'true', text: meta.icon }),
        el('div', null, [
          el('div', { class: 'row-between' }, [
            el('span', { class: 'notif-title', text: n.title }),
            el('span', { class: 'row', style: 'gap:8px' }, [
              !n.read ? el('span', { class: 'badge badge-accent', style: 'font-size:.66rem', text: 'New' }) : null,
              el('span', { class: 'notif-time', text: U.relativeDay(n.date) + ' ' + n.time })
            ])
          ]),
          el('div', { class: 'notif-text', text: n.message }),
          !n.read ? el('button', {
            class: 'btn btn-ghost btn-sm', type: 'button', style: 'margin-top:6px;padding-left:0',
            onclick: function () { Store.markNotificationRead(s, n.id); render(); }
          }, 'Mark as read') : null
        ])
      ]);
      body.appendChild(row);
    });

    host.appendChild(el('p', { class: 'page-intro', style: 'margin-bottom:14px' },
      unread ? U.plural(unread, 'unread notification') + '.' : 'Everything has been read.'));
    host.appendChild(body);
  }

  render();
})();
</script>
</body>
</html>
