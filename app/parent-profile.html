<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My details — LAPMS</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script>try{var t=localStorage.getItem('lapms.theme')||'light';if(t!=='system')document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
</head>
<body>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {
  var m = Shell.mount({
    roles: ['parent'],
    page: 'parent-profile',
    title: 'My details',
    sub: 'Contact details and access'
  });
  if (!m) return;

  var el = U.el, c = m.content, s = Store.session(), sc = m.scope, d = Store.db();
  var grid = el('div', { class: 'grid grid-2' });
  c.appendChild(grid);

  // ---------------- Contact details ----------------
  var phone = el('input', { type: 'text', id: 'ph', value: sc.user.phone || '' });
  var email = el('input', { type: 'email', id: 'em', value: sc.user.email || '' });
  grid.appendChild(Shell.card('Contact details',
    'Used for attendance alerts and emergency messages.',
    el('div', null, [
      el('div', { class: 'field' }, [el('label', null, 'Name'),
        el('input', { type: 'text', value: sc.user.name, disabled: true }),
        el('p', { class: 'hint' }, 'Held by the school — contact the office to change it.')]),
      el('div', { class: 'field' }, [el('label', { for: 'ph' }, 'Phone number'), phone]),
      el('div', { class: 'field' }, [el('label', { for: 'em' }, 'Email'), email]),
      el('button', {
        class: 'btn btn-primary btn-sm', type: 'button',
        onclick: function () {
          Store.updateContact(s, { phone: phone.value.trim(), email: email.value.trim() });
          U.toast('Contact details updated');
        }
      }, 'Save contact details')
    ])
  ));

  // ---------------- Linked children ----------------
  var children = Store.learners(s, {});
  var kidBody = el('div');
  children.forEach(function (l) {
    var link = d.parentLinks.filter(function (x) {
      return x.learnerId === l.id && sc.parent && x.parentId === sc.parent.id;
    })[0];
    kidBody.appendChild(el('div', { class: 'row', style: 'gap:12px;padding:12px 0;border-bottom:1px solid var(--border)' }, [
      el('span', { class: 'avatar', 'aria-hidden': 'true', text: U.initials(l.name) }),
      el('span', { class: 'grow', style: 'min-width:0' }, [
        el('a', { href: 'learner.html?id=' + l.id, style: 'color:inherit;font-weight:600;font-size:.9rem', text: l.name }),
        el('div', { class: 'muted', style: 'font-size:.76rem',
          text: Store.classLabel(l.classId) + ' · ' + l.admissionNo +
            (link ? ' · you are recorded as ' + link.relationship.toLowerCase() : '') })
      ]),
      el('span', { class: 'badge badge-present' }, [el('span', { class: 'dot' }), 'Authorised'])
    ]));
  });
  grid.appendChild(Shell.card('My children',
    'Linked and authorised by the school. Contact the office to change this.',
    children.length ? kidBody : Shell.emptyState('No learners linked.')));

  // ---------------- What this account can see ----------------
  var canSee = [
    ['Your children’s attendance', true],
    ['Your children’s lateness and absence, with any reason recorded', true],
    ['Behaviour notes the school has shared with you', true],
    ['Your own home departure and arrival confirmations', true],
    ['Messages between you and your children’s teachers', true],
    ['Other learners in the class', false],
    ['Other guardians’ names or contact details', false],
    ['Teachers’ personal records or the school audit log', false],
    ['Behaviour notes the school has kept internal', false]
  ];
  var seeBody = el('ul', { class: 'check-list', style: 'list-style:none;padding:0;margin:0' },
    canSee.map(function (r) {
      return el('li', null, [
        el('span', { class: r[1] ? 'tick' : 'cross', 'aria-hidden': 'true', text: r[1] ? '✓' : '✕' }),
        el('span', { text: r[0] })
      ]);
    }));
  grid.appendChild(Shell.card('What this account can see',
    'A saved URL cannot reach anything on the lower list.',
    seeBody));

  // ---------------- Privacy ----------------
  grid.appendChild(Shell.card('Your data',
    null,
    el('div', { style: 'font-size:.875rem' }, [
      el('p', { class: 'secondary' },
        'The school is the data controller. Ask the office for a copy of your child’s records, or to correct them.'),
      el('p', { class: 'secondary' },
        'Your contact details are not visible to other guardians.'),
      el('div', { class: 'row', style: 'flex-wrap:wrap' }, [
        el('a', { class: 'btn btn-sm', href: '../privacy.html' }, 'Privacy notice'),
        el('a', { class: 'btn btn-sm', href: 'messages.html' }, 'Contact the school')
      ])
    ])
  ));

  // ---------------- Sign-in security (specification) ----------------
  grid.appendChild(Shell.card('Sign-in and security',
    '',
    el('div', { style: 'font-size:.875rem' }, [
      el('ul', { style: 'padding-left:18px;color:var(--text-secondary)' }, [
        'Credentials are verified on the server, never in the browser.',
        'Passwords are stored only as salted hashes, with a minimum-strength policy.',
        'Sessions expire, and signing out ends the session on the server.',
        'Two-factor authentication is available where the school enables it.',
        'Data is encrypted in transit, and sensitive fields are protected at rest.'
      ].map(function (t) { return el('li', { style: 'margin-bottom:5px', text: t }); })),
      el('div', { class: 'notice' }, [
        el('span', { class: 'notice-icon', 'aria-hidden': 'true', text: 'ⓘ' }),
        el('span', { text: 'This demonstration has no sign-in. Accounts are chosen from a list so the access rules can be reviewed.' })
      ])
    ])
  ));
})();
</script>
</body>
</html>
